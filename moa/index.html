<main id="main">
  <section class="intro"><p class="eyebrow">PROJECT OVERVIEW</p><h1>프로젝트 진행 현황</h1><p>프로젝트별 상태와 공개용 요약, 기록 확인시각을 함께 살펴보세요.</p><p class="scope" id="scope"></p></section>

  </section>
  <section aria-labelledby="collection-title"><div class="section-head"><h2 id="collection-title">공개 프로젝트</h2><span id="result-count" aria-live="polite"></span></div><div id="projects" class="project-grid" tabindex="-1"></div><div id="empty" class="empty" hidden><h3>검색 결과가 없습니다</h3><p>검색어나 진행 상태 필터를 바꿔 보세요.</p><button id="clear-filters">모든 프로젝트 보기</button></div></section>
