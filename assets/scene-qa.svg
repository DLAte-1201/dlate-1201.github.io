<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Quality Assurance &amp; Evidence · 조건 적용 후 재검사 · 합성 예시</title><desc id="desc">‘검토 완료만’ 필터를 선택한 작업 목록 예상 목록과 표시 목록을 비교하고, 항목을 추가한 뒤에도 필터가 적용되는지 살펴봅니다. 여기서는 필터 조건에 따른 표시 차이를 설명합니다. 실제 서비스의 원인은 실행 환경과 상태를 재현해 확인해야 합니다.</desc><g font-family="Segoe UI,Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101f32" stroke="#101f32"/><text x="64" y="55" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="64" dy="0">ReSeorch.AI / WORKING APPROACH</tspan></text><text x="64" y="115" fill="#f8fafc" font-size="46" font-weight="600"><tspan x="64" dy="0">02  Quality Assurance &amp; Evidence</tspan></text><text x="64" y="167" fill="#cbd5e1" font-size="26" font-weight="400"><tspan x="64" dy="0">오류를 재현하고 원인을 좁힙니다</tspan></text><rect x="50" y="182" width="1500" height="480" rx="12" fill="#192d43" stroke="#38516a"/><text x="64" y="235" fill="#cbd5e1" font-size="23" font-weight="400"><tspan x="64" dy="0">작업 목록 · 검토 완료만 표시</tspan></text><rect x="64" y="260" width="725" height="275" rx="12" fill="#192d43" stroke="#38516a"/><rect x="811" y="260" width="725" height="275" rx="12" fill="#192d43" stroke="#38516a"/><text x="84" y="295" fill="#67e8f9" font-size="24" font-weight="600"><tspan x="84" dy="0">예상 결과</tspan></text><text x="831" y="295" fill="#fcd34d" font-size="24" font-weight="600"><tspan x="831" dy="0">표시 결과</tspan></text><rect x="80" y="318" width="693" height="50" rx="12" fill="#192d43" stroke="#38516a"/><text x="96" y="348" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="96" dy="0">B · 검토 완료</tspan></text><rect x="827" y="318" width="693" height="50" rx="12" fill="#192d43" stroke="#38516a"/><text x="843" y="348" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="843" dy="0">B · 검토 완료</tspan></text><text x="64" y="575" fill="#a7f3d0" font-size="23" font-weight="600"><tspan x="64" dy="0">조건 적용 후: 완료 항목만 표시</tspan></text><text x="64" y="613" fill="#cbd5e1" font-size="20" font-weight="400"><tspan x="64" dy="0">재현 순서와 확인한 조건을 함께 기록</tspan></text><text x="64" y="710" fill="#67e8f9" font-size="26" font-weight="600"><tspan x="64" dy="0">STEP 05 / 6 · 조건 적용 후 재검사</tspan></text><text x="64" y="754" fill="#f8fafc" font-size="23" font-weight="400"><tspan x="64" dy="0">완료 상태만 선택하는 조건을 적용한 목록과 비교합니다.</tspan></text><text x="64" y="799" fill="#cbd5e1" font-size="21" font-weight="400"><tspan x="64" dy="0">이 조건에서는 완료 항목 B만 남습니다.</tspan></text><text x="64" y="836" fill="#fcd34d" font-size="19" font-weight="400"><tspan x="64" dy="0">Illustrative demonstration using synthetic data.</tspan></text></g></svg>
