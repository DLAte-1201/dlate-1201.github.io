<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Korean Language &amp; Context · 문맥 A 대조 · 합성 예시</title><desc id="desc">‘그거 거기 두면 돼.’라는 문장과 두 가지 앞선 대화 ‘그거’와 ‘거기’가 가리키는 대상과 장소를 문맥에 비추어 살펴봅니다. 문맥에 따른 해석 과정을 설명하는 예시입니다. 특정 모델의 한국어 이해 성능을 시험한 결과는 아닙니다.</desc><g font-family="Segoe UI,Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101f32" stroke="#101f32"/><text x="64" y="55" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="64" dy="0">ReSeorch.AI / WORKING APPROACH</tspan></text><text x="64" y="115" fill="#f8fafc" font-size="46" font-weight="600"><tspan x="64" dy="0">04  Korean Language &amp; Context</tspan></text><text x="64" y="167" fill="#cbd5e1" font-size="26" font-weight="400"><tspan x="64" dy="0">문맥을 대조해 의미를 좁혀갑니다</tspan></text><rect x="50" y="182" width="1500" height="480" rx="12" fill="#192d43" stroke="#38516a"/><text x="64" y="252" fill="#f8fafc" font-size="42" font-weight="600"><tspan x="64" dy="0">“그거 거기 두면 돼.”</tspan></text><rect x="64" y="290" width="725" height="240" rx="12" fill="#192d43" stroke="#38516a"/><rect x="811" y="290" width="725" height="240" rx="12" fill="#192d43" stroke="#38516a"/><text x="84" y="326" fill="#93c5fd" font-size="22" font-weight="600"><tspan x="84" dy="0">앞선 대화</tspan></text><text x="84" y="376" fill="#f8fafc" font-size="23" font-weight="400"><tspan x="84" dy="0">자료 파일은 어디에 둘까요?</tspan><tspan x="84" dy="34.04">서류함 윗칸을 비워뒀어요.</tspan></text><text x="831" y="326" fill="#67e8f9" font-size="22" font-weight="600"><tspan x="831" dy="0">해석 후보</tspan></text><text x="831" y="376" fill="#f8fafc" font-size="23" font-weight="400"><tspan x="831" dy="0">그거 → 자료 파일</tspan><tspan x="831" dy="34.04">거기 → 서류함 윗칸</tspan></text><text x="64" y="575" fill="#67e8f9" font-size="23" font-weight="600"><tspan x="64" dy="0">앞선 대화에 근거한 해석 후보</tspan></text><text x="64" y="613" fill="#cbd5e1" font-size="20" font-weight="400"><tspan x="64" dy="0">문장이 같아도 문맥에 따라 달라지는 의미</tspan></text><text x="64" y="710" fill="#67e8f9" font-size="26" font-weight="600"><tspan x="64" dy="0">STEP 03 / 5 · 문맥 A 대조</tspan></text><text x="64" y="754" fill="#f8fafc" font-size="23" font-weight="400"><tspan x="64" dy="0">자료 파일과 서류함 윗칸을 언급한 대화를 함께 읽습니다.</tspan></text><text x="64" y="799" fill="#cbd5e1" font-size="21" font-weight="400"><tspan x="64" dy="0">‘그거’는 자료 파일, ‘거기’는 서류함 윗칸을 가리키는 것으로 읽힙니다.</tspan></text><text x="64" y="836" fill="#fcd34d" font-size="19" font-weight="400"><tspan x="64" dy="0">Illustrative demonstration using synthetic data.</tspan></text></g></svg>
