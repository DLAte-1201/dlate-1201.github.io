<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">AI Systems &amp; Orchestration · 수정으로 되돌리기 · 합성 예시</title><desc id="desc">안내 문서의 초안과 검토표를 만드는 요청 초안 작성, 사실 대조, 형식 검토를 나누고 결과를 다시 모아 확인합니다. 독립적으로 연구하는 설계입니다. 실제 도구 연동과 운영 성능은 별도의 구현·시험이 필요합니다.</desc><g font-family="Segoe UI,Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="1600" height="900" rx="0" fill="#101f32" stroke="#101f32"/><text x="64" y="55" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="64" dy="0">ReSeorch.AI / WORKING APPROACH</tspan></text><text x="64" y="115" fill="#f8fafc" font-size="46" font-weight="600"><tspan x="64" dy="0">03  AI Systems &amp; Orchestration</tspan></text><text x="64" y="167" fill="#cbd5e1" font-size="26" font-weight="400"><tspan x="64" dy="0">AI에 맡길 일과 사람이 확인할 일을 나눕니다</tspan></text><rect x="50" y="182" width="1500" height="480" rx="12" fill="#192d43" stroke="#38516a"/><rect x="665" y="220" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="681" y="250" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="681" dy="0">요청 · 범위</tspan></text><path d="M800 284L199 315" fill="none" stroke="#38516a" stroke-width="2"/><rect x="64" y="315" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="80" y="345" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="80" dy="0">초안 작성</tspan></text><path d="M199 379L800 425" fill="none" stroke="#38516a" stroke-width="2"/><path d="M800 284L800 315" fill="none" stroke="#38516a" stroke-width="2"/><rect x="665" y="315" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="681" y="345" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="681" dy="0">사실 대조</tspan></text><path d="M800 379L800 425" fill="none" stroke="#38516a" stroke-width="2"/><path d="M800 284L1401 315" fill="none" stroke="#38516a" stroke-width="2"/><rect x="1266" y="315" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="1282" y="345" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="1282" dy="0">형식 검토</tspan></text><path d="M1401 379L800 425" fill="none" stroke="#38516a" stroke-width="2"/><rect x="665" y="425" width="270" height="64" rx="12" fill="#192d43" stroke="#67e8f9"/><text x="681" y="455" fill="#67e8f9" font-size="20" font-weight="600"><tspan x="681" dy="0">검토 · 반례 확인</tspan></text><path d="M800 489L800 520" fill="none" stroke="#38516a" stroke-width="2"/><rect x="665" y="520" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="681" y="550" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="681" dy="0">사람의 검토</tspan></text><path d="M665 457H74V347H89" fill="none" stroke="#fcd34d" stroke-width="3" stroke-dasharray="7 5"/><text x="78" y="521" fill="#fcd34d" font-size="18" font-weight="400"><tspan x="78" dy="0">수정 반환</tspan></text><rect x="1266" y="520" width="270" height="64" rx="12" fill="#192d43" stroke="#38516a"/><text x="1282" y="550" fill="#f8fafc" font-size="20" font-weight="400"><tspan x="1282" dy="0">검토용 산출물</tspan></text><path d="M935 552L1266 552" fill="none" stroke="#38516a" stroke-width="2"/><text x="64" y="634" fill="#cbd5e1" font-size="20" font-weight="400"><tspan x="64" dy="0">작업 분배 → 결과 검토 → 사람의 확인</tspan></text><text x="64" y="710" fill="#67e8f9" font-size="26" font-weight="600"><tspan x="64" dy="0">STEP 05 / 7 · 수정으로 되돌리기</tspan></text><text x="64" y="754" fill="#f8fafc" font-size="23" font-weight="400"><tspan x="64" dy="0">근거가 부족한 부분은 사유와 함께 작성 단계로 돌려보냅니다.</tspan></text><text x="64" y="799" fill="#cbd5e1" font-size="21" font-weight="400"><tspan x="64" dy="0">수정된 결과도 같은 기준으로 다시 검토하도록 연결합니다.</tspan></text><text x="64" y="836" fill="#fcd34d" font-size="19" font-weight="400"><tspan x="64" dy="0">Illustrative demonstration using synthetic data.</tspan></text></g></svg>
