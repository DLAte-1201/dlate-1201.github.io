<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="440" viewBox="0 0 1024 440" role="img" aria-labelledby="t d"><title id="t">개인 프리랜서 운영원장 작업 흐름 설명도</title><desc id="d">입력 구조 → 예외 상태 → 원자료 보존 검토 → 정산 완료 미확인</desc><g font-family="Segoe UI,Malgun Gothic,Apple SD Gothic Neo,sans-serif"><rect x="0" y="0" width="1024" height="440" rx="0" fill="#101f32" stroke="#101f32"/><text x="40" y="62" fill="#f8fafc" font-size="32" font-weight="600"><tspan x="40" dy="0">개인 프리랜서 운영원장</tspan></text><text x="40" y="108" fill="#cbd5e1" font-size="20" font-weight="400"><tspan x="40" dy="0">입력에서 검토와 기록까지</tspan></text><rect x="40" y="155" width="220" height="154" rx="12" fill="#192d43" stroke="#38516a"/><text x="60" y="190" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="60" dy="0">01</tspan></text><text x="60" y="232" fill="#f8fafc" font-size="23" font-weight="500"><tspan x="60" dy="0">입력 구조</tspan></text><path d="M260 228L280 228" fill="none" stroke="#93c5fd" stroke-width="2"/><rect x="280" y="155" width="220" height="154" rx="12" fill="#192d43" stroke="#38516a"/><text x="300" y="190" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="300" dy="0">02</tspan></text><text x="300" y="232" fill="#f8fafc" font-size="23" font-weight="500"><tspan x="300" dy="0">예외 상태</tspan></text><path d="M500 228L520 228" fill="none" stroke="#93c5fd" stroke-width="2"/><rect x="520" y="155" width="220" height="154" rx="12" fill="#192d43" stroke="#38516a"/><text x="540" y="190" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="540" dy="0">03</tspan></text><text x="540" y="232" fill="#f8fafc" font-size="23" font-weight="500"><tspan x="540" dy="0">원자료 보존</tspan><tspan x="540" dy="34.04">검토</tspan></text><path d="M740 228L760 228" fill="none" stroke="#93c5fd" stroke-width="2"/><rect x="760" y="155" width="220" height="154" rx="12" fill="#192d43" stroke="#38516a"/><text x="780" y="190" fill="#93c5fd" font-size="20" font-weight="600"><tspan x="780" dy="0">04</tspan></text><text x="7